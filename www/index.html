<script>
var $=function(i){return document.getElementById(i);},E=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var LS={g:function(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}},s:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}},d:function(k){try{localStorage.removeItem(k);}catch(e){}}};
var IDX={states:[]},VC={},VTOK=0,VCODE={},REG_P='gp-registry-ccb70',REG_K='AIzaSyC31V2J-N6UCunB6W5bDTBVOeJBuudVHbQ',DIR={directory:{},gps:[]},GP=null,SES=null,CFG=null,TAB='home',MOCK=(location.search.match(/[?&]mock=([^&]+)/)||[])[1];
var U=MOCK?{auth:MOCK+'/idt',tok:MOCK+'/tok',fs:MOCK+'/fs'}:{auth:'https://identitytoolkit.googleapis.com',tok:'https://securetoken.googleapis.com',fs:'https://firestore.googleapis.com/v1'};
// ── Firestore/Auth REST ──
function http(method,url,body,hdr,form){
  var o={method:method,headers:Object.assign(form?{'Content-Type':'application/x-www-form-urlencoded'}:{'Content-Type':'application/json'},hdr||{})};
  if(body!=null)o.body=form?body:JSON.stringify(body);
  return fetch(url,o).then(function(r){return r.text().then(function(t){var j={};try{j=t?JSON.parse(t):{};}catch(e){}
    if(!r.ok){var m=(j.error&&(j.error.message||j.error.status))||('HTTP '+r.status);throw Object.assign(new Error(m),{http:r.status});}return j;});});
}
function errText(e){var m=String(e&&e.message||e);
  var t={EMAIL_EXISTS:'हा मोबाईल आधीच नोंदणीकृत आहे — "लॉगिन" वापरा',EMAIL_NOT_FOUND:'हा मोबाईल नोंदणीकृत नाही — आधी "नवीन नोंदणी" करा',INVALID_PASSWORD:'पासवर्ड चुकीचा आहे',INVALID_LOGIN_CREDENTIALS:'मोबाईल किंवा पासवर्ड चुकीचा आहे',WEAK_PASSWORD:'पासवर्ड किमान ६ अक्षरांचा हवा',OPERATION_NOT_ALLOWED:'ग्रामपंचायतीने Email/Password सुरू केलेले नाही',TOO_MANY_ATTEMPTS_TRY_LATER:'खूप प्रयत्न झाले — थोड्या वेळाने प्रयत्न करा'};
  for(var k in t)if(m.indexOf(k)>=0)return t[k];
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))return 'इंटरनेट जोडणी तपासा';
  if(e&&e.http===403||/PERMISSION_DENIED|insufficient/i.test(m))return 'परवानगी नाही (ग्रामपंचायतीचे नियम तपासा)';
  return m;}
function fsEnc(v){if(v==null)return{nullValue:null};if(typeof v==='string')return{stringValue:v};if(typeof v==='boolean')return{booleanValue:v};
  if(typeof v==='number')return Math.floor(v)===v?{integerValue:String(v)}:{doubleValue:v};
  if(Array.isArray(v))return{arrayValue:{values:v.map(fsEnc)}};var f={};Object.keys(v).forEach(function(k){if(v[k]!==undefined)f[k]=fsEnc(v[k]);});return{mapValue:{fields:f}};}
function fsDec(f){if(!f)return null;if('stringValue' in f)return f.stringValue;if('integerValue' in f)return Number(f.integerValue);if('doubleValue' in f)return f.doubleValue;if('booleanValue' in f)return f.booleanValue;if('timestampValue' in f)return f.timestampValue;
  if('arrayValue' in f)return((f.arrayValue||{}).values||[]).map(fsDec);if('mapValue' in f){var o={},m=(f.mapValue||{}).fields||{};Object.keys(m).forEach(function(k){o[k]=fsDec(m[k]);});return o;}return null;}
function docOut(d){var o={},fl=d.fields||{};Object.keys(fl).forEach(function(k){o[k]=fsDec(fl[k]);});o._id=String(d.name||'').split('/').pop();return o;}
function fsBase(){return U.fs+'/projects/'+encodeURIComponent(GP.p)+'/databases/(default)/documents';}
function authUrl(op){return U.auth+(MOCK?'/accounts:':'/v1/accounts:')+op+'?key='+encodeURIComponent(GP.k);}
function token(){
  if(!SES)return Promise.reject(new Error('लॉगिन आवश्यक'));
  if(Date.now()<SES.exp-60000)return Promise.resolve(SES.idToken);
  return http('POST',U.tok+(MOCK?'/token':'/v1/token')+'?key='+encodeURIComponent(GP.k),'grant_type=refresh_token&refresh_token='+encodeURIComponent(SES.refreshToken),null,true).then(function(r){
    SES.idToken=r.id_token;SES.refreshToken=r.refresh_token||SES.refreshToken;SES.exp=Date.now()+(+r.expires_in||3600)*1000;LS.s(sesKey(),SES);return SES.idToken;});
}
function sesKey(){return 'GPAPP_SES_'+GP.p;}
function fsGet(path){return token().then(function(t){return http('GET',fsBase()+'/'+path,null,{Authorization:'Bearer '+t});}).then(docOut,function(e){if(e.http===404)return null;throw e;});}
function fsCreate(col,id,obj){if(SES&&SES.wa&&col!=='gpapp_seq'&&obj.wa===undefined)obj.wa=SES.wa;var f={};Object.keys(obj).forEach(function(k){if(obj[k]!==undefined)f[k]=fsEnc(obj[k]);});
  return token().then(function(t){return http('POST',fsBase()+'/'+col+'?documentId='+encodeURIComponent(id),{fields:f},{Authorization:'Bearer '+t});});}
function fsMine(){return token().then(function(t){return http('POST',fsBase()+':runQuery',{structuredQuery:{from:[{collectionId:'gpapp_req'}],where:{fieldFilter:{field:{fieldPath:'uid'},op:'EQUAL',value:{stringValue:SES.uid}}}}},{Authorization:'Bearer '+t});}).then(function(r){
  return (r||[]).filter(function(x){return x.document;}).map(function(x){return docOut(x.document);});});}
function rid(){var a='abcdefghijklmnopqrstuvwxyz0123456789',s='';for(var i=0;i<20;i++)s+=a[Math.floor(Math.random()*a.length)];return s;}
function msg(id,t,c){var el=$(id);if(el)el.innerHTML=t?'<div class="msg '+(c||'inf')+'">'+E(t)+'</div>':'';}
// ── इमेज → JPEG (लहान) ──
function pickImg(file,maxW,q,cb){var rd=new FileReader();rd.onload=function(){var im=new Image();im.onload=function(){var r=Math.min(1,maxW/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);
  var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);var u=c.toDataURL('image/jpeg',q);
  if(u.length>260000)u=c.toDataURL('image/jpeg',q*0.6);cb(u);};im.onerror=function(){cb('');};im.src=rd.result;};rd.onerror=function(){cb('');};rd.readAsDataURL(file);}
// ── सुरुवात ──
function boot(){
  fetch((window.GP_REMOTE||'')+'directory.json?'+Date.now()).then(function(r){return r.json();}).catch(function(){return fetch('directory.json').then(function(r){return r.json();});}).catch(function(){return LS.g('GPAPP_DIR')||{};}).then(function(d){
    DIR={directory:d.directory||{},gps:d.gps||[]};LS.s('GPAPP_DIR',d);
    return fetch('directory-index.json').then(function(r){return r.json();}).then(function(x){try{localStorage.setItem('GPAPP_IDX',JSON.stringify(x));}catch(e){}return x;}).catch(function(){return LS.g('GPAPP_IDX')||{states:[]};});
  }).then(function(ix){
    IDX=ix||{states:[]};
    var sv=LS.g('GPAPP_GP');if(sv&&sv.p){GP=sv;SES=LS.g(sesKey());return SES?enter():authScreen();}
    pickScreen();
  });
  if('serviceWorker' in navigator&&!MOCK)navigator.serviceWorker.register('sw.js').catch(function(){});
}
function opts(list,sel){return '<option value="">— निवडा —</option>'+list.map(function(x){var mr=x.mr!==undefined?x.mr:x,en=x.en||'';return '<option value="'+E(mr)+'"'+(mr===sel?' selected':'')+'>'+E(en&&en!==mr?en+' — '+mr:mr)+'</option>';}).join('');}
// यादी: राज्य → जिल्हा → तालुका → गाव; प्रत्येक नाव "English — मराठी" (किंमत = मराठी नाव). गावे जिल्हानिहाय फाईलमधून लोड होतात.
function srt(a){return a.sort(function(x,y){return (x.en||x.mr).toLowerCase()<(y.en||y.mr).toLowerCase()?-1:1;});}
function mergeNames(items,custom){var have={};items.forEach(function(x){have[x.mr]=1;});Object.keys(custom||{}).forEach(function(k){if(!have[k]){items.push({mr:k,en:''});have[k]=1;}});return srt(items);}
function stObj(s){return (IDX.states||[]).filter(function(x){return x.mr===s;})[0];}
function dsObj(s,d){var o=stObj(s);return o&&(o.d||[]).filter(function(x){return x.mr===d;})[0];}
function tlObj(s,d,t){var o=dsObj(s,d);return o&&(o.t||[]).filter(function(x){return x.mr===t;})[0];}
function stList(){return mergeNames((IDX.states||[]).map(function(x){return {mr:x.mr,en:x.en};}),DIR.directory);}
function dsList(s){var o=stObj(s);return mergeNames(((o&&o.d)||[]).map(function(x){return {mr:x.mr,en:x.en};}),DIR.directory[s]);}
function tlList(s,d){var o=dsObj(s,d);return mergeNames(((o&&o.t)||[]).map(function(x){return {mr:x.mr,en:x.en};}),(DIR.directory[s]||{})[d]);}
function getVillages(s,d,t,cb){
  var cust=((((DIR.directory[s]||{})[d]||{})[t])||[]).map(function(x){return {mr:x,en:''};});
  var so=stObj(s),dobj=dsObj(s,d),to=tlObj(s,d,t);
  if(!(so&&dobj&&to))return cb(srt(cust),true);
  var key=so.code+'_'+dobj.c;
  var done=function(j,ok){var out=((j&&j[to.c])||[]).map(function(v){return {mr:v[1],en:v[0],code:v[2]};}),have={};out.forEach(function(x){have[x.mr]=1;});cust.forEach(function(x){if(!have[x.mr])out.push(x);});cb(srt(out),ok);};
  if(VC[key])return done(VC[key],true);
  fetch('dir/'+key+'.json').then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(j){VC[key]=j;done(j,true);}).catch(function(){done(null,false);});
}
function pickScreen(){
  $('nav').classList.add('hidden');$('lo').classList.add('hidden');$('chg').classList.add('hidden');$('ttl').textContent='🏛️ माझी ग्रामपंचायत';
  $('m').innerHTML='<div class="card"><h2>तुमचे गाव निवडा</h2><label>राज्य / State</label><select id="ps" onchange="pc(1)"></select><label>जिल्हा / District</label><select id="pd" onchange="pc(2)"></select><label>तालुका / Taluka</label><select id="pt" onchange="pc(3)"></select><label>गाव / Village</label><select id="pv" onchange="pc(4)"></select><div id="pm"></div><button class="p" onclick="pgo()">पुढे जा</button></div>';
  $('ps').innerHTML=opts(stList());pc(1);
}
function pc(l){var s=$('ps').value;
  if(l<=1)$('pd').innerHTML=opts(s?dsList(s):[]);
  var d=$('pd').value;
  if(l<=2)$('pt').innerHTML=opts(s&&d?tlList(s,d):[]);
  var t=$('pt').value;
  if(l<=3){var tok=++VTOK;
    if(!(s&&d&&t)){$('pv').innerHTML=opts([]);return;}
    $('pv').innerHTML='<option value="">⏳ गावे लोड होत आहेत…</option>';
    getVillages(s,d,t,function(list,ok){if(tok!==VTOK)return;VCODE={};list.forEach(function(x){if(x.code)VCODE[x.mr]=x.code;});$('pv').innerHTML=opts(list);if(!ok)msg('pm','इंटरनेट नसल्याने सर्व गावे लोड झाली नाहीत — नेट चालू करून पुन्हा निवडा.','err');else msg('pm','');});}
}
function regGet(vc){ // केंद्रीय नोंदणी (gp-registry) मधून गावाची Firebase माहिती
  return fetch('https://firestore.googleapis.com/v1/projects/'+REG_P+'/databases/(default)/documents/gps/'+encodeURIComponent(vc)+'?key='+REG_K).then(function(r){
    if(r.status===404)return null;
    if(!r.ok)throw new Error('reg '+r.status);
    return r.json().then(function(j){var f=(j&&j.fields)||{},o={};['s','d','t','v','p','k','w'].forEach(function(k){o[k]=(f[k]&&f[k].stringValue)||'';});return o;});
  });
}
function pgo(){var s=$('ps').value,d=$('pd').value,t=$('pt').value,v=$('pv').value;if(!(s&&d&&t&&v))return msg('pm','राज्य, जिल्हा, तालुका व गाव चारही निवडा','err');
  var g=DIR.gps.filter(function(x){return x.s===s&&x.d===d&&x.t===t&&x.v===v;})[0],vc=VCODE[v];
  var done=function(g){
    if(!g||!g.p||!g.k||/^FIREBASE_/.test(g.p)||/^FIREBASE_/.test(g.k))return msg('pm','"'+v+'" ग्रामपंचायतीने अजून ॲप सुरू केलेले नाही. लवकरच उपलब्ध होईल.','inf');
    GP=g;LS.s('GPAPP_GP',g);SES=LS.g(sesKey());SES?enter():authScreen();};
  if(!vc)return done(g);
  msg('pm','⏳ तपासत आहे…','inf');
  regGet(vc).then(function(r){done(r&&r.p?r:g);},function(){if(g)return done(g);msg('pm','इंटरनेट/नोंदणी तपासता आली नाही — नेट चालू आहे का ते पाहून पुन्हा प्रयत्न करा.','err');});
}

function logout(){fcmOff();ntStop();if(GP)LS.d(sesKey());SES=null;authScreen();}

var AUTHMODE='in';

function seqName(pre,n){var t=String(n);while(t.length<4)t='0'+t;return pre+t;}
function seqExists(pre,n){return fsGet('gpapp_seq/'+seqName(pre,n)).then(function(d){return !!d;});}
function seqFindNext(pre){ // 1..N सर्व असतात (क्रम खंडित नाही) म्हणून exponential + binary शोध
  var hint=+(LS.g('GPAPP_HINT_'+pre+GP.p)||0);
  function first(){return hint>0?seqExists(pre,hint).then(function(e){return e?hint:0;}):Promise.resolve(0);}
  return first().then(function(lo){
    function grow(lo,step){return seqExists(pre,lo+step).then(function(e){return e?grow(lo+step,step*2):[lo,lo+step];});}
    function bin(lo,hi){if(hi-lo<=1)return Promise.resolve(hi);var mid=Math.floor((lo+hi)/2);return seqExists(pre,mid).then(function(e){return e?bin(mid,hi):bin(lo,mid);});}
    return grow(lo,1).then(function(r){return bin(r[0],r[1]);});
  });
}
function seqReserve(pre){
  function tryN(n,k){if(k>12)return Promise.reject(new Error('क्रमांक मिळाला नाही — पुन्हा प्रयत्न करा'));
    return fsCreate('gpapp_seq',seqName(pre,n),{uid:SES.uid,ts:new Date().toISOString()}).then(function(){LS.s('GPAPP_HINT_'+pre+GP.p,n);return seqName(pre,n);},
      function(e){if(e.http===409||/ALREADY_EXISTS/.test(e.message))return tryN(n+1,k+1);throw e;});}
  return seqFindNext(pre).then(function(n){return tryN(n,0);});
}

var IDXM={};

      var v={rows:rows.map(function(r){return {r:r,h:normQ(kind==='n8'?r.slice(0,5).join(' '):r.join(' '))};}),upd:meta.upd,fmt:meta.fmt||1,cnt:n};

function dmy(s){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?m[3]+'-'+m[2]+'-'+m[1]:(s||'');}
function rowView(kind,r){ // {t: शीर्षक, s: उपशीर्षक}

function dueOf(r){if(!(r.length>=7&&r[5]!=null&&r[6]!=null))return null;var o={p:+r[5]||0,c:+r[6]||0};

function discPay(x,d){return Math.round((x.p||0)*(1-d.pm/100)+(x.c||0)*(1-d.pc/100));}
function myTaxAdj(ano){var a={g:0,w:0,t:0,pend:0,appr:0};

    var pend=q.status==='paid_pending',appr=q.status==='approved'&&MYT.upd&&String(q.decidedAt||'')>String(MYT.upd);

    if(sp){a.g+=g+Math.round(+q.sutGh||0);a.w+=w+Math.round(+q.sutPa||0);}else a.t+=Math.round(+q.amount||0); // सवलतीसह भरलेल्या भरण्यात सवलतही फेडलेली धरतो

  if(o.g&&o.w){o.g={p:o.g.p,c:o.g.c};o.w={p:o.w.p,c:o.w.c};
    var rest=a.t;rest=cutDue(o.g,a.g+rest);cutDue(o.w,a.w+rest);

// ⬇️ PDF डाउनलोड / 🖨️ प्रिंट — सॉफ्टवेअरच्या PDF सारखाच, एकाच A4 पानात (certpdf.js)
function dlCert(i,mode){var printOnly=(mode===1),share=(mode===2),asImg=(mode===3);var r=MINE[i];if(!r||!r.certHtml)return;
  var btn=$(asImg?'imgb'+i:'pdfb'+i),old=btn&&btn.innerHTML,done=false;if(btn){btn.disabled=true;btn.innerHTML='⏳ तयार होत आहे…';}
  var back=function(){if(btn){btn.disabled=false;btn.innerHTML=old;}};
  var fin=function(res){if(done)return;done=true;clearTimeout(wd);back();
    if(res==='saved')alert('✅ '+(asImg?'फोटो':'PDF')+' डाउनलोड सुरू केला — ब्राउझरच्या Downloads मध्ये पहा.');};
  var fail=function(e){if(done)return;done=true;clearTimeout(wd);back();alert((asImg?'फोटो':'PDF')+' तयार करता आले नाही: '+((e&&e.message)||e));};
  var wd=setTimeout(function(){fail(new Error('वेळ संपला — पुन्हा प्रयत्न करा'));},90000);
  if(!window.certPdfMake){fail(new Error('PDF साधन लोड झाले नाही — ॲप पुन्हा उघडा.'));return;}
  certPdfMake(r).then(function(res){return (printOnly?certPdfOpen(res):share?certPdfShare(res):asImg?certImgDeliver(res):certPdfDeliver(res));}).then(fin,fail);}

// ── 📢 सूचना / 🚨 आणीबाणी ──
// ग्रामपंचायत सॉफ्टवेअर 'gpapp/notices' मध्ये यादी (JSON) ठेवते: [{i:id,k:'n'|'e',x:मजकूर,ts}]. ॲप उघडे असताना दर २० सेकंदांनी तपासते.
var NT={list:[],t:null,busy:false,ac:null,osc:null,cur:null,hooked:false};
function ntKey(s){return 'GPAPP_N'+s+'_'+GP.p;}
function ntParse(d){try{var a=JSON.parse((d&&d.n)||'[]');return Array.isArray(a)?a:[];}catch(e){return [];}}
function ntDt(ts){var t=new Date(ts);if(isNaN(t))return '';var p=function(n){return n<10?'0'+n:''+n;};return p(t.getDate())+'-'+p(t.getMonth()+1)+'-'+t.getFullYear()+' '+p(t.getHours())+':'+p(t.getMinutes());}
function ntStart(){fcmInit();
  ntStop();NT.list=LS.g(ntKey('LIST'))||[];ntInitNotif();ntPoll();
  NT.t=setInterval(function(){if(!document.hidden)ntPoll();},20000);
  if(!NT.hooked){NT.hooked=true;
    document.addEventListener('visibilitychange',function(){if(!document.hidden&&GP&&SES)ntPoll();});
    ['click','touchstart'].forEach(function(ev){document.addEventListener(ev,function(){if(NT.ac&&NT.ac.state==='suspended')try{NT.ac.resume();}catch(e){}},true);});}
}
function ntStop(){if(NT.t)clearInterval(NT.t);NT.t=null;sirenStop();ntSpeakStop();var em=$('em');if(em)em.remove();}
function ntPoll(){
  if(!GP||!SES||NT.busy)return;NT.busy=true;
  fsGet('gpapp/notices').then(function(d){NT.busy=false;var l=ntParse(d);LS.s(ntKey('LIST'),l);ntApply(l);},function(){NT.busy=false;});
}
function ntApply(l){
  var alerted=LS.g(ntKey('SEEN')),first=!alerted,now=Date.now(),fresh=[];alerted=alerted||[];NT.list=l;
  l.forEach(function(x){
    if(alerted.indexOf(x.i)>=0)return;
    var age=now-new Date(x.ts).getTime();
    alerted.push(x.i);
    if(first&&!(x.k==='e'&&age<900000))return; // नवीन इन्स्टॉलवर जुन्या सूचनांचा आवाज/पॉपअप नको
    fresh.push({x:x,age:age});
  });
  LS.s(ntKey('SEEN'),alerted.slice(-100));
  var em=fresh.filter(function(f){return f.x.k==='e';}).sort(function(a,b){return a.age-b.age;})[0];
  fresh.filter(function(f){return f.x.k!=='e'&&!(NT.fcm&&f.age>45000);}).forEach(function(f){ntNotify('📢 '+((CFG&&CFG.gp)||'ग्रामपंचायत')+' — सूचना',f.x.x,false);});
  var nn=fresh.filter(function(f){return f.x.k!=='e';}).sort(function(a,b){return a.age-b.age;})[0];
  if(nn&&!em)ntBanner(nn.x);
  if(em){var late=NT.fcm&&em.age>45000;if(!late&&document.hidden)ntNotify('🚨 आणीबाणी सूचना',em.x.x,true);showEm(em.x,em.age<3600000&&!late);} // १ तासापेक्षा जुना आणीबाणी संदेश सायरनशिवाय दाखवतो
  if(TAB==='notice'){ntMarkRead();ntRender();}else navDraw();
}
function ntUnread(){if(!GP)return 0;var r=LS.g(ntKey('READ'))||[];return (NT.list||[]).filter(function(x){return r.indexOf(x.i)<0;}).length;}
function ntMarkRead(){LS.s(ntKey('READ'),(NT.list||[]).map(function(x){return x.i;}).slice(-100));navDraw();}

// ── 📡 FCM Push (ॲप बंद असतानाही) — सर्व गावांसाठी एकच केंद्रीय FCM प्रोजेक्ट; गावानुसार topic 'gp_<Firebase project id>' ──
function fcmPlugin(){try{return (window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()&&Capacitor.Plugins&&Capacitor.Plugins.FirebaseMessaging)||null;}catch(e){return null;}}
function fcmTopic(){return 'gp_'+String(GP.p).replace(/[^a-zA-Z0-9_.~%-]/g,'_');}
function fcmInit(){
  var FM=fcmPlugin();if(!FM||!GP)return;var top=fcmTopic();
  if(!NT.fcmL){NT.fcmL=true;
    try{FM.addListener('notificationReceived',function(ev){ntPushIn((ev&&ev.notification&&ev.notification.data)||{},false);});
      FM.addListener('notificationActionPerformed',function(ev){ntPushIn((ev&&ev.notification&&ev.notification.data)||{},true);});}catch(e){}}
  FM.requestPermissions().then(function(){return FM.subscribeToTopic({topic:top});}).then(function(){NT.fcm=top;LS.s('GPAPP_FCMTOP',top);},function(){});
}
function fcmOff(){var FM=fcmPlugin(),top=NT.fcm||LS.g('GPAPP_FCMTOP');NT.fcm=null;if(FM&&top){try{FM.unsubscribeFromTopic({topic:top}).catch(function(){});}catch(e){}LS.d('GPAPP_FCMTOP');}}
function ntPushIn(dt,tap){ // dt = FCM data: {i,k,x,ts}
  if(!GP||!SES){return;}
  if(!dt.i||!dt.x){ntPoll();return;}
  var it={i:String(dt.i),k:dt.k==='e'?'e':'n',x:String(dt.x),ts:dt.ts||new Date().toISOString()};
  var al=LS.g(ntKey('SEEN'))||[],was=al.indexOf(it.i)>=0;
  if(!was){al.push(it.i);LS.s(ntKey('SEEN'),al.slice(-100));}
  if(!(NT.list||[]).some(function(y){return y.i===it.i;})){NT.list=[it].concat(NT.list||[]);LS.s(ntKey('LIST'),NT.list);}
  if(it.k==='e'){if(tap||!was)showEm(it,!tap&&!was);} // नोटिफिकेशन दाबून आल्यास सायरन परत वाजवत नाही (तो आधीच वाजला)
  else if(tap)tab('notice');else if(!was)ntBanner(it);
  if(TAB==='notice'){ntMarkRead();ntRender();}else navDraw();
  ntPoll();
}
// ── नोटिफिकेशन (APK: LocalNotifications; ब्राउझर: Notification API) ──
function ntLN(){try{return window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;}catch(e){return null;}}
function ntInitNotif(){
  var FM=fcmPlugin(),LN=ntLN();
  if(FM){ // सायरन आवाज (res/raw/siren.wav) फक्त चॅनेल बनवतानाच ठरतो — म्हणून आधी येथेच बनवतो
    try{FM.createChannel({id:'gp-alarm',name:'आणीबाणी सूचना (सायरन)',description:'गावातील आणीबाणी संदेश',importance:5,visibility:1,vibration:true,sound:'siren.wav',lights:true}).catch(function(){});
      FM.createChannel({id:'gp-info',name:'ग्रामपंचायत सूचना',importance:4,visibility:1,vibration:true}).catch(function(){});}catch(e){}}
  else if(LN){try{LN.createChannel({id:'gp-alarm',name:'आणीबाणी सूचना (सायरन)',importance:5,visibility:1,vibration:true,sound:'siren.wav'}).catch(function(){});
    LN.createChannel({id:'gp-info',name:'ग्रामपंचायत सूचना',importance:4,visibility:1,vibration:true}).catch(function(){});}catch(e){}}
  if(LN)try{LN.requestPermissions().catch(function(){});}catch(e){}
}
function ntNotify(title,body,urgent){
  var LN=ntLN();
  if(LN){try{LN.schedule({notifications:[{id:Math.floor(Math.random()*2000000000),title:title,body:body,channelId:urgent?'gp-alarm':'gp-info'}]}).catch(function(){});}catch(e){}return;}
  try{if('Notification' in window&&Notification.permission==='granted'){
    if(navigator.serviceWorker&&navigator.serviceWorker.ready)navigator.serviceWorker.ready.then(function(r){r.showNotification(title,{body:body,icon:'icon-192.png',vibrate:urgent?[600,200,600,200,600]:[200],requireInteraction:!!urgent});}).catch(function(){new Notification(title,{body:body,icon:'icon-192.png'});});
    else new Notification(title,{body:body,icon:'icon-192.png'});}}catch(e){}
}
function ntAskPerm(){try{Notification.requestPermission().then(function(){if(TAB==='notice')ntRender();});}catch(e){}}
function ntBanner(x){var o=$('ntb');if(o)o.remove();o=document.createElement('div');o.id='ntb';
  o.innerHTML='<b>📢 नवीन सूचना</b><div style="margin-top:4px;white-space:pre-wrap">'+E(x.x.length>160?x.x.slice(0,160)+'…':x.x)+'</div><button id="ntb-p">पहा</button><button id="ntb-x">बंद</button>';
  document.body.appendChild(o);
  $('ntb-p').onclick=function(){o.remove();tab('notice');};$('ntb-x').onclick=function(){o.remove();};
  setTimeout(function(){if(o.parentNode)o.remove();},15000);}
// ── 🔊 मराठी आवाजात वाचन (फोनचे TTS; मराठी आवाज नसल्यास हिंदी) ──
function ntVoice(){try{var v=speechSynthesis.getVoices()||[],f=function(p){return v.filter(function(x){return String(x.lang).toLowerCase().replace('_','-').indexOf(p)===0;})[0];};return f('mr')||f('hi');}catch(e){return null;}}
function ntTts(){try{var C=window.Capacitor;return (C&&C.getPlatform&&C.getPlatform()!=='web'&&C.registerPlugin)?C.registerPlugin('TextToSpeech'):null;}catch(e){return null;}}
function ntSpeakStop(){NT.spOn=false;NT.spTok=(NT.spTok||0)+1;try{var T=ntTts();if(T)T.stop();}catch(e){}try{window.speechSynthesis&&speechSynthesis.cancel();}catch(e){}try{if(NT.spA){NT.spA.pause();NT.spA.removeAttribute('src');}}catch(e){}}
// 🔊 वाचन: फोनमध्ये मराठी आवाज असल्यास तोच; नसल्यास इंटरनेटवरून मराठी आवाज (कोणत्याही फोनवर चालतो); तेही न जमल्यास फोनचा उपलब्ध आवाज.
function ntSpeakChunks(t){var out=[],parts=String(t).replace(/\s+/g,' ').match(/[^।.!?]+[।.!?]*/g)||[String(t)];
  parts.forEach(function(p){p=p.trim();while(p.length>180){var k=p.lastIndexOf(' ',180);if(k<60)k=180;out.push(p.slice(0,k).trim());p=p.slice(k).trim();}if(p)out.push(p);});return out;}
function ntSpeakNative(text,v){var s=window.speechSynthesis;if(!s||!window.SpeechSynthesisUtterance)return false;
  var parts=String(text).match(/[^।.!?\n]+[।.!?\n]*/g)||[String(text)];
  parts.forEach(function(p){if(!p.trim())return;var u=new SpeechSynthesisUtterance(p.trim());u.lang=(v&&v.lang)||'mr-IN';if(v)u.voice=v;u.volume=1;u.rate=0.9;u.pitch=1;s.speak(u);});return true;}
// 📱 APK: फोनचे मूळ (native) Text-to-Speech — इंटरनेट/ब्राउझर आवाज लागत नाही. मराठी → हिंदी → इतर क्रमाने.
function ntSpeakDevice(text){var T=ntTts();if(!T)return Promise.reject(new Error('no-native'));
  var q=ntSpeakChunks(text),tok=NT.spTok=(NT.spTok||0)+1;NT.spOn=true;
  var langs=['mr-IN','hi-IN','en-IN'];
  function pick(i){if(i>=langs.length)return Promise.reject(new Error('no-lang'));
    return T.isLanguageSupported({lang:langs[i]}).then(function(r){return r&&r.supported?langs[i]:pick(i+1);},function(){return langs[i];});}
  return pick(0).then(function(lang){
    var k=0;function next(){if(tok!==NT.spTok)return Promise.resolve();if(k>=q.length){NT.spOn=false;return Promise.resolve();}
      return T.speak({text:q[k++],lang:lang,rate:0.9,pitch:1,volume:1,category:'playback',queueStrategy:1}).then(next);}
    return next();}).then(function(){NT.spOn=false;},function(e){NT.spOn=false;throw e;});}
function ntSpeak(text){
  if(NT.spOn||(window.speechSynthesis&&speechSynthesis.speaking)){ntSpeakStop();return;}
  if(ntTts()){ntSpeakDevice(text).then(null,function(e){if(String((e&&e.message)||e).indexOf('cancel')>=0)return;
    alert('फोनवर आवाज वाचता आला नाही. फोनच्या Settings → Language/Accessibility → Text-to-speech मध्ये "Speech Services by Google" निवडून मराठी (किंवा हिंदी) आवाज डाउनलोड करा.');});return;}
  var v=ntVoice(),mr=v&&String(v.lang).toLowerCase().replace('_','-').indexOf('mr')===0;
  if(mr&&ntSpeakNative(text,v)){NT.spOn=true;return;}
  var q=ntSpeakChunks(text),tok=NT.spTok=(NT.spTok||0)+1,a=NT.spA||(NT.spA=new Audio()),i=0,bad=false;NT.spOn=true;
  function fallback(){if(tok!==NT.spTok)return;NT.spOn=false;if(!ntSpeakNative(text,v))alert('आवाजाने वाचण्यासाठी इंटरनेट चालू असावे (किंवा फोनमध्ये मराठी/हिंदी "Text-to-speech" आवाज असावा).');}
  function next(){if(tok!==NT.spTok)return;if(i>=q.length){NT.spOn=false;return;}
    a.onended=function(){i++;next();};a.onerror=function(){if(!bad){bad=true;fallback();}};
    a.src='https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=mr&q='+encodeURIComponent(q[i]);
    var pr=a.play();if(pr&&pr.catch)pr.catch(function(){if(!bad){bad=true;fallback();}});}
  next();
}
function ntSpeakIdx(i){var x=NT.list[i];if(x)ntSpeak((x.k==='e'?'आणीबाणी सूचना. ':'सूचना. ')+x.x);}
// ── 🚨 सायरन (WebAudio) — आवाज फोनच्या मीडिया-व्हॉल्यूमनुसार; ॲप सायरनसाठी सिग्नल पूर्ण पातळीवर ठेवते ──
function sirenStart(){
  sirenHalt();var C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  try{if(!NT.ac)NT.ac=new C();NT.ac.resume();}catch(e){return;}
  var ac=NT.ac,o=ac.createOscillator(),g=ac.createGain(),t0=ac.currentTime+0.05,n=75; // ७५ फेऱ्या ≈ २ मिनिटे
  o.type='square';g.gain.value=1;o.connect(g);g.connect(ac.destination);NT.gn=g;
  for(var k=0;k<n;k++){o.frequency.setValueAtTime(650,t0+k*1.6);o.frequency.linearRampToValueAtTime(1500,t0+k*1.6+0.8);o.frequency.linearRampToValueAtTime(650,t0+k*1.6+1.6);}
  o.start(t0);o.stop(t0+n*1.6);NT.osc=o;
  try{var pat=[];for(var j=0;j<60;j++)pat.push(700,250);navigator.vibrate&&navigator.vibrate(pat);}catch(e){}
  setTimeout(function(){var h=$('em-h');if(h&&NT.ac&&NT.ac.state!=='running')h.textContent='🔊 आवाज येण्यासाठी स्क्रीनला एकदा स्पर्श करा';},500);
}
// ॲपमधील सायरन (WebAudio) पूर्ण थांबवतो — आवाज शून्य, तार तोडणे, AudioContext suspend, कंपन बंद
function sirenHalt(){
  if(NT.osc){try{NT.osc.disconnect();}catch(e){}try{NT.osc.stop();}catch(e){}}NT.osc=null;
  try{if(NT.gn){NT.gn.gain.value=0;NT.gn.disconnect();}}catch(e){}NT.gn=null;
  try{if(NT.ac&&NT.ac.state==='running')NT.ac.suspend();}catch(e){}
  try{navigator.vibrate&&navigator.vibrate(0);}catch(e){}
}
// फोनच्या नोटिफिकेशनचा सायरन (channel sound siren.wav ≈ २० सेकंद) ॲपमधून थांबत नव्हता — नोटिफिकेशन काढले की तो आवाज थांबतो
function ntClearNotifs(){
  try{var LN=ntLN();if(LN){
    if(LN.removeAllDeliveredNotifications)LN.removeAllDeliveredNotifications().catch(function(){});
    if(LN.getPending)LN.getPending().then(function(p){if(p&&p.notifications&&p.notifications.length)LN.cancel({notifications:p.notifications});}).catch(function(){});}}catch(e){}
  try{var FM=fcmPlugin();if(FM&&FM.removeAllDeliveredNotifications)FM.removeAllDeliveredNotifications().catch(function(){});}catch(e){}
}
function sirenStop(){sirenHalt();ntClearNotifs();}
function showEm(x,ring){
  var o=$('em');if(o)o.remove();NT.cur=x;o=document.createElement('div');o.id='em';
  o.innerHTML='<div style="font-size:64px;line-height:1">🚨</div><h1>आणीबाणी सूचना</h1><div style="font-size:14px;opacity:.9">'+E((CFG&&CFG.gp)||'ग्रामपंचायत')+' · '+E(ntDt(x.ts))+'</div><div class="emt">'+E(x.x)+'</div><div id="em-h" style="font-size:14px;margin-bottom:6px"></div>'+
    (ring?'<button id="em-s" style="background:#ffeb3b;color:#000" onclick="sirenStop();this.style.display=\'none\'">🔕 सायरन बंद करा</button>':'')+
    '<button style="background:#0D2B5E;color:#fff" onclick="emClose()">ठीक आहे / बंद करा</button>';
  document.body.appendChild(o);if(ring)sirenStart();
}
function ntSpeakCur(){if(NT.cur){sirenStop();var s=$('em-s');if(s)s.style.display='none';ntSpeakStop();ntSpeak('आणीबाणी सूचना. '+NT.cur.x);}}
function emClose(){sirenStop();ntSpeakStop();var o=$('em');if(o)o.remove();if(TAB==='notice')ntRender();}
function openEm(i){var x=NT.list[i];if(x)showEm(x,false);}
// ── 📢 सूचना टॅब ──
function vNotice(){ntMarkRead();$('m').innerHTML='<button class="s" style="width:100%;margin:4px 0 14px" onclick="ntPoll()">🔄 ताजे करा</button><div id="ntp"></div><div id="ntl"></div>';ntRender();ntPoll();}
function ntRender(){
  var el=$('ntl');if(!el)return;var l=NT.list||[],p=$('ntp');
  if(p)p.innerHTML=(!ntLN()&&'Notification' in window&&Notification.permission==='default')?'<div class="msg inf">🔔 फोनवर नोटिफिकेशन हवे असल्यास <button class="s" onclick="ntAskPerm()">नोटिफिकेशन चालू करा</button></div>':'';
  el.innerHTML=l.length?l.map(function(x,i){var e=x.k==='e';
    return '<div class="card nt'+(e?' e':'')+'"><div class="row"><b style="flex:1;color:'+(e?'#b71c1c':'#0D2B5E')+'">'+(e?'🚨 आणीबाणी संदेश':'📢 नोटीस')+'</b><small>'+E(ntDt(x.ts))+'</small></div><div class="tx">'+E(x.x)+'</div>'+(e?'<div class="row"><button class="s" style="flex:1;border-color:#b71c1c;color:#b71c1c" onclick="openEm('+i+')">🚨 मोठ्या स्क्रीनवर पहा</button></div>':'')+'</div>';}).join(''):'<div class="card"><div class="msg inf">अजून कोणतीही सूचना नाही.</div></div>';
}
function vWeb(){var w=CFG&&CFG.web;$('m').innerHTML=w?'<div class="card" style="padding:6px"><iframe src="'+E(w)+'" title="ग्रामपंचायत वेबसाईट"></iframe><div style="text-align:center;margin-top:6px"><a href="'+E(w)+'" target="_blank" rel="noopener">वेबसाईट वेगळ्या टॅबमध्ये उघडा ↗</a></div></div>':'<div class="card"><div class="msg inf">ग्रामपंचायतीने वेबसाईट अजून प्रकाशित केलेली नाही.</div></div>';}
boot();
</script></body></html>
